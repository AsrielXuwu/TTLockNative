name: TTLockNative
options:
  bundleIdPrefix: com.local.smartlock
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

targets:
  TTLockNative:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.smartlock.ttlock
        PRODUCT_NAME: TTLockNative
        INFOPLIST_KEY_CFBundleDisplayName: 门锁控制
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "需要使用蓝牙连接并控制附近的智能门锁"
        INFOPLIST_KEY_NSBluetoothPeripheralUsageDescription: "需要使用蓝牙与智能门锁通信"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO